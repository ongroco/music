<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Music Platform</title>
    <style>
        /* CSS: Styling the Interface */
        :root {
            --bg-dark: #121212;
            --bg-light: #181818;
            --text-primary: #ffffff;
            --text-secondary: #b3b3b3;
            --accent-green: #1db954;
        }

        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            margin: 0;
            background-color: var(--bg-dark);
            color: var(--text-primary);
            display: grid;
            grid-template-columns: 240px 1fr;
            grid-template-rows: 1fr 90px;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar */
        .sidebar {
            background-color: #000;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-links button {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            text-align: left;
            padding: 10px 0;
            transition: color 0.3s;
        }

        .nav-links button:hover {
            color: var(--text-primary);
        }

        .upload-btn {
            margin-top: auto;
            background-color: var(--text-primary);
            color: #000;
            border: none;
            padding: 12px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
        }

        /* Main Content */
        .main-content {
            background: linear-gradient(180deg, #2a2a2a 0%, var(--bg-dark) 100%);
            padding: 20px 40px;
            overflow-y: auto;
        }

        h1 { font-size: 32px; margin-bottom: 20px; }

        .song-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .song-row {
            display: grid;
            grid-template-columns: 50px 4fr 3fr 1fr;
            align-items: center;
            padding: 10px;
            border-radius: 4px;
            color: var(--text-secondary);
            cursor: pointer;
        }

        .song-row:hover {
            background-color: rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
        }

        .play-icon { color: var(--text-primary); }

        /* Bottom Player */
        .player-bar {
            grid-column: 1 / -1;
            background-color: var(--bg-light);
            border-top: 1px solid #282828;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
        }

        .now-playing {
            display: flex;
            align-items: center;
            gap: 15px;
            width: 30%;
        }

        .album-art {
            width: 56px;
            height: 56px;
            background-color: #333;
        }

        .track-info h4 { margin: 0; font-size: 14px; }
        .track-info p { margin: 0; font-size: 11px; color: var(--text-secondary); }

        .controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 40%;
        }

        .control-buttons {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 5px;
        }

        .btn-play {
            background-color: var(--text-primary);
            border: none;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .progress-container {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 11px;
            color: var(--text-secondary);
        }

        .progress-bar {
            flex-grow: 1;
            height: 4px;
            background-color: #535353;
            border-radius: 2px;
            position: relative;
        }

        .progress-fill {
            width: 30%;
            height: 100%;
            background-color: var(--text-primary);
            border-radius: 2px;
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="logo">🎧 Streamify</div>
        <div class="nav-links">
            <button>Home</button>
            <button>Search</button>
            <button>Your Library</button>
        </div>
        <button class="upload-btn" onclick="alert('This requires backend logic to handle file uploads!')">Upload Music</button>
    </div>

    <div class="main-content">
        <h1>Your Uploads</h1>
        <div class="song-list">
            <div class="song-row" style="border-bottom: 1px solid #333; margin-bottom: 10px;">
                <span>#</span>
                <span>Title</span>
                <span>Date Added</span>
                <span>Time</span>
            </div>

            <div class="song-row" onclick="playSong('Song Title 1', 'Artist Name')">
                <span class="play-icon">▶</span>
                <span>Demo Track 1 <br><small>Artist Name</small></span>
                <span>2 days ago</span>
                <span>3:45</span>
            </div>

            <div class="song-row" onclick="playSong('Song Title 2', 'Artist Name')">
                <span class="play-icon">▶</span>
                <span>Demo Track 2 <br><small>Artist Name</small></span>
                <span>5 days ago</span>
                <span>2:15</span>
            </div>
        </div>
    </div>

    <div class="player-bar">
        <div class="now-playing">
            <div class="album-art"></div> <div class="track-info">
                <h4 id="current-title">Select a song</h4>
                <p id="current-artist">...</p>
            </div>
        </div>

        <div class="controls">
            <div class="control-buttons">
                <button style="background:none; border:none; color:white;">⏮</button>
                <button class="btn-play">▶</button>
                <button style="background:none; border:none; color:white;">⏭</button>
            </div>
            <div class="progress-container">
                <span>0:00</span>
                <div class="progress-bar">
                    <div class="progress-fill"></div>
                </div>
                <span>3:45</span>
            </div>
        </div>
        
        <div style="width: 30%;"></div> </div>

    <script>
        // Simple JS to update the player UI text
        function playSong(title, artist) {
            document.getElementById('current-title').innerText = title;
            document.getElementById('current-artist').innerText = artist;
            // Note: Actual audio playing requires an <audio> tag and source file
        }
    </script>
</body>
</html>
