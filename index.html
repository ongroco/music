<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deep Current | Media Portal</title>
    <style>
        :root {
            --bg-dark: #0a0f14; /* Deep Ocean Dark */
            --bg-light: #101820;
            --text-primary: #ffffff;
            --text-secondary: #94a3b8;
            --accent-blue: #0ea5e9; /* Deep Current Blue */
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            margin: 0;
            background-color: var(--bg-dark);
            color: var(--text-primary);
            display: grid;
            grid-template-columns: 240px 1fr;
            grid-template-rows: 1fr 90px;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar */
        .sidebar {
            background-color: #05070a;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            border-right: 1px solid #1e293b;
        }

        .logo {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: -1px;
            color: var(--accent-blue);
        }

        .nav-links button {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-weight: 500;
            font-size: 14px;
            cursor: pointer;
            text-align: left;
            padding: 10px 0;
            width: 100%;
        }

        .nav-links button:hover { color: var(--accent-blue); }

        .upload-btn {
            margin-top: auto;
            background-color: var(--accent-blue);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        /* Main Content */
        .main-content {
            background: linear-gradient(180deg, #0f172a 0%, var(--bg-dark) 40%);
            padding: 40px;
            overflow-y: auto;
        }

        h1 { font-size: 28px; margin-bottom: 24px; font-weight: 700; }

        .song-row {
            display: grid;
            grid-template-columns: 50px 4fr 3fr 1fr;
            align-items: center;
            padding: 12px;
            border-radius: 8px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: 0.2s;
        }

        .song-row:hover {
            background-color: rgba(14, 165, 233, 0.1);
            color: var(--text-primary);
        }

        /* Bottom Player */
        .player-bar {
            grid-column: 1 / -1;
            background-color: #05070a;
            border-top: 1px solid #1e293b;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
        }

        .btn-play {
            background-color: white;
            border: none;
            border-radius: 50%;
            width: 35px;
            height: 35px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="logo">🌊 DEEP CURRENT</div>
        <div class="nav-links">
            <button>Intelligence Dashboard</button>
            <button>Due Diligence Audio</button>
            <button>Client Library</button>
        </div>
        <button class="upload-btn">Upload Intel</button>
    </div>

    <div class="main-content">
        <h1>Recent Reports & Media</h1>
        <div class="song-list">
            <div class="song-row">
                <span>1</span>
                <span>Project Alpha Insight <br><small>Due Diligence Report</small></span>
                <span>Feb 3, 2026</span>
                <span>12:45</span>
            </div>
            <div class="song-row">
                <span>2</span>
                <span>Remote Viewing Session 09 <br><small>Deep Current Analysis</small></span>
                <span>Jan 28, 2026</span>
                <span>45:20</span>
            </div>
        </div>
    </div>

    <div class="player-bar">
        <div style="width: 30%;">
            <h4 style="margin:0; font-size:14px;">Select Intelligence Track</h4>
            <p style="margin:0; font-size:11px; color:var(--text-secondary);">Deep Current Consulting</p>
        </div>
        <div style="display:flex; flex-direction:column; align-items:center; width:40%;">
            <button class="btn-play">▶</button>
        </div>
        <div style="width: 30%;"></div>
    </div>

</body>
</html>
